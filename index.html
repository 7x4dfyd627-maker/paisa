<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Paisa">
<meta name="theme-color" content="#0A6B54">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Paisa — Income &amp; Spending</title>
<style>
  :root{
    --bg:#F2F2F7; --card:#FFFFFF; --ink:#1C1C1E; --ink2:#6C6C70; --ink3:#AEAEB2;
    --hairline:rgba(60,60,67,0.29); --accent:#0A6B54; --accent-soft:#E2F2ED;
    --income:#2E9E5B; --expense:#D64541; --xfer:#3A6EA5; --xfer-soft:#E8F0F9;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); overscroll-behavior-y:none}
  .num{font-variant-numeric:tabular-nums}
  .screen{display:none; padding:calc(var(--sat) + 12px) 16px calc(var(--sab) + 96px); max-width:640px; margin:0 auto; min-height:100vh}
  .screen.active{display:block}
  h1.large{font-size:34px; font-weight:800; letter-spacing:-0.4px; padding:8px 0 14px}
  h2.sect{font-size:13px; font-weight:600; color:var(--ink2); text-transform:uppercase; letter-spacing:0.5px; margin:22px 4px 8px}
  .card{background:var(--card); border-radius:14px; overflow:hidden}
  .row{display:flex; align-items:center; gap:12px; padding:12px 16px; position:relative}
  .row + .row::before{content:""; position:absolute; left:16px; right:0; top:0; height:0.5px; background:var(--hairline)}
  .row .grow{flex:1; min-width:0}
  .row .title{font-size:16px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .row .sub{font-size:13px; color:var(--ink2); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .amt{font-size:16px; font-weight:600}
